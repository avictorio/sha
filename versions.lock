# versions.lock -- pinned versions the installer uses (key = value; read with ConvertFrom-StringData).
# Update deliberately and record why in the commit message.

ollama_version = v0.40.8
nssm_winget_version = 2.24-101-g897c7ad
docker_desktop_version = 4.96.1

# D2 candidates for the P1.1 benchmark (tags checked on registry.ollama.ai, 2026-10-21).
# q4_K_M for the 30B-A3B: the GPU has 12 GB VRAM; q8_0 (30.3 GB) would sit mostly in RAM.
model_candidates = qwen3:30b-a3b-instruct-2507-q4_K_M,gpt-oss:20b,qwen3-coder:30b
# S6 (2026-10-22): native context from `ollama show`, as tag@tokens. P1.1 needs at least 65536.
# Dropped: qwen3:32b@40960 (below 64K; dense, so about half of it would sit in RAM on 12 GB of VRAM).
model_native_context = qwen3:30b-a3b-instruct-2507-q4_K_M@262144,gpt-oss:20b@131072,qwen3-coder:30b@262144
# D2 (P1.1): no candidate passed the go rule; for the proof of concept the owner chose the
# best scorer that meets the speed rule (4/7). Read by installer/steps/06-model.ps1 (P1.2).
model_default = qwen3-coder:30b
# D9 (P1.4): the default profile is cloud-first on this OpenRouter model and falls back to
# model_default; the key's monthly limit (USD) that 07-cloud.ps1 requires. The local profile stays on model_default.
cloud_model_default = meta/muse-wonder
cloud_key_limit_usd = 50
# P1.7 (2026-10-22): 7-Zip for the encrypted nightly backup (winget id 7zip.7zip, publisher Igor Pavlov).
sevenzip_winget_version = 26.05

# Hermes Agent installer: the copy read and reviewed on 2026-10-21 (1672 lines). 04-hermes.ps1
# refuses any other. If upstream changes, review the new copy, then update the hash.
hermes_install_url = https://hermes-agent.nousresearch.com/install.ps1
hermes_install_ps1_sha256 = 9B7C951B2455DF32F6C07A43B0AD6ACDAD9A5ADCD86753AA9B195609AEE42BC5
# The Hermes version that installer produced on this machine (as reported by Hermes during Phases 0-1). P5.2 and P6.9 compare against it.
hermes_version = 0.22.4

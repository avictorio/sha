# D2 candidates for the P1.1 benchmark (tags checked on registry.ollama.ai, 2026-10-21).
# q4_K_M for the 30B-A3B: the GPU has 12 GB VRAM; q8_0 (30.3 GB) would sit mostly in RAM.
